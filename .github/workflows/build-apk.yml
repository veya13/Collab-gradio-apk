Several environment variables and/or system properties contain different paths to the SDK.
ANDROID_HOME: /home/runner/Android/Sdk
ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
```[span_0](start_span)[span_0](end_span)

Artinya ada **dua variabel path SDK yang berbeda** (`ANDROID_HOME` mengarah ke `/home/runner/Android/Sdk`, sedangkan `ANDROID_SDK_ROOT` bawaan runner masih mengarah ke `/usr/local/lib/android/sdk`), sehingga Gradle menolak lanjut[span_1](start_span)[span_1](end_span).

### Cara Memperbaikinya
Samakan `ANDROID_SDK_ROOT` dengan `ANDROID_HOME` (dan unset/hapus perbedaan path-nya) di langkah **`Install Android SDK & Command Line Tools`** pada `.github/workflows/build-apk.yml`.

Ganti seluruh isi `.github/workflows/build-apk.yml` menjadi seperti ini:

```yaml
name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK & Command Line Tools
        run: |
          ANDROID_HOME=$HOME/Android/Sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm cmdline-tools.zip

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColabGradioBrowser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
